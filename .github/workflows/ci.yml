name: CI
on:
  pull_request:
  push:
    branches: [master]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: pnpm/action-setup@v4
        with: {version: 10.13.1}
      - uses: actions/setup-node@v4
        with: {node-version: 26.5.0, cache: pnpm}
      - uses: extractions/setup-just@v2
      - run: just bootstrap
      - name: Derive affected range
        run: echo "NX_BASE=$(git merge-base origin/master HEAD)" >> "$GITHUB_ENV"
      - if: github.event_name == 'pull_request'
        run: just check
      - if: github.event_name == 'push'
        run: just check-all
  llmlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: astral-sh/setup-uv@v6
      # llmlint: ignore[changed_behavior_has_e2e] Pinning the Node runtime for a CI-only CLI installer has no browser interface; the installer verifies the real npm package and executable.
      - uses: actions/setup-node@v4
        # llmlint: ignore[changed_behavior_has_e2e] This exact runtime pin serves only the CLI installer and has no browser-facing behavior.
        with: {node-version: 26.5.0}
      - uses: extractions/setup-just@v2
      - run: just setup-llmlint
      - run: just lint-llm-validate --diff-base origin/master
      # Credentialed runs install the repository-pinned Codex harness and execute
      # the judge. Fork PRs receive no secret, so they stop after static validation
      # without downloading a harness or making a model call.
      - name: Run llmlint judge when credentialed
        env: {OPENAI_API_KEY: "${{ secrets.OPENAI_API_KEY }}"}
        run: |
          # llmlint: ignore[live_tier_compiles_and_requires_credential] GitHub withholds repository secrets from fork PRs; those runs must remain merge-testable and still complete lint-llm-validate above without claiming that the model judge ran.
          if [ -n "$OPENAI_API_KEY" ]; then
            # llmlint: ignore[changed_behavior_has_e2e] This CI-only setup has no browser interface; setup-llm-harness exercises the real npm package boundary and the PR check proves the installed judge executes.
            just setup-llm-harness
            just lint-llm-diff
          else
            # llmlint: ignore[live_tier_compiles_and_requires_credential] Fork PRs cannot receive this repository secret; this explicit successful branch preserves fork validation while accurately reporting that only static validation ran.
            # llmlint: ignore[changed_behavior_has_e2e] This accurate CI-only status message has no browser interface.
            echo "OPENAI_API_KEY not available; static llmlint validation passed and the model judge is not run for this fork PR."
          fi
