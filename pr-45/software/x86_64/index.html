<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>software</title>
<style>body{font-family:system-ui,sans-serif;margin:2rem;color:#222}section.shot{margin-bottom:2.5rem}section.shot[hidden]{display:none}h2{margin-bottom:.5rem}.toggles{display:flex;flex-wrap:wrap;gap:1rem;margin:0 0 1.5rem;position:sticky;top:0;background:#fff;padding:.75rem 0;z-index:1}.toggle{display:flex;align-items:center;gap:.4rem}.dim-label{font-size:.8rem;color:#555}.toggle button{font:inherit;font-size:.8rem;padding:.15rem .6rem;border:1px solid #bbb;background:#f6f6f6;border-radius:999px;cursor:pointer}.toggle button.active{background:#222;color:#fff;border-color:#222}.variants img{max-width:100%;height:auto;border:1px solid #ddd;border-radius:4px}.variant[hidden]{display:none}</style>
</head>
<body>
<h1>software</h1>
<div class="toggles"><div class="toggle" data-dim="viewport"><span class="dim-label">Viewport</span><button type="button" data-val="desktop" class="active">desktop</button><button type="button" data-val="tablet">tablet</button><button type="button" data-val="mobile">mobile</button></div><div class="toggle" data-dim="render"><span class="dim-label">Rendering path</span><button type="button" data-val="standalone" class="active">standalone</button><button type="button" data-val="host-composed">host-composed</button></div><div class="toggle" data-dim="state"><span class="dim-label">State</span><button type="button" data-val="happy" class="active">happy</button><button type="button" data-val="empty">empty</button><button type="button" data-val="loading">loading</button><button type="button" data-val="error">error</button></div></div>
<section class="shot"><h2>software</h2>
<div class="variants"><img class="variant" data-variant="render=host-composed;state=empty;viewport=desktop" loading="lazy" src="host-composed/empty/desktop.png" alt="software [render=host-composed, state=empty, viewport=desktop]" hidden><img class="variant" data-variant="render=host-composed;state=error;viewport=desktop" loading="lazy" src="host-composed/error/desktop.png" alt="software [render=host-composed, state=error, viewport=desktop]" hidden><img class="variant" data-variant="render=host-composed;state=happy;viewport=desktop" loading="lazy" src="host-composed/happy/desktop.png" alt="software [render=host-composed, state=happy, viewport=desktop]" hidden><img class="variant" data-variant="render=host-composed;state=happy;viewport=mobile" loading="lazy" src="host-composed/happy/mobile.png" alt="software [render=host-composed, state=happy, viewport=mobile]" hidden><img class="variant" data-variant="render=host-composed;state=happy;viewport=tablet" loading="lazy" src="host-composed/happy/tablet.png" alt="software [render=host-composed, state=happy, viewport=tablet]" hidden><img class="variant" data-variant="render=host-composed;state=loading;viewport=desktop" loading="lazy" src="host-composed/loading/desktop.png" alt="software [render=host-composed, state=loading, viewport=desktop]" hidden><img class="variant" data-variant="render=standalone;state=empty;viewport=desktop" loading="lazy" src="standalone/empty/desktop.png" alt="software [render=standalone, state=empty, viewport=desktop]" hidden><img class="variant" data-variant="render=standalone;state=error;viewport=desktop" loading="lazy" src="standalone/error/desktop.png" alt="software [render=standalone, state=error, viewport=desktop]" hidden><img class="variant" data-variant="render=standalone;state=happy;viewport=desktop" loading="lazy" src="standalone/happy/desktop.png" alt="software [render=standalone, state=happy, viewport=desktop]"><img class="variant" data-variant="render=standalone;state=happy;viewport=mobile" loading="lazy" src="standalone/happy/mobile.png" alt="software [render=standalone, state=happy, viewport=mobile]" hidden><img class="variant" data-variant="render=standalone;state=happy;viewport=tablet" loading="lazy" src="standalone/happy/tablet.png" alt="software [render=standalone, state=happy, viewport=tablet]" hidden><img class="variant" data-variant="render=standalone;state=loading;viewport=desktop" loading="lazy" src="standalone/loading/desktop.png" alt="software [render=standalone, state=loading, viewport=desktop]" hidden></div></section>
<script>const bar=document.querySelector('.toggles');if(bar){const sel={};for(const t of bar.querySelectorAll('.toggle')){const a=t.querySelector('button.active')||t.querySelector('button');if(a)sel[t.dataset.dim]=a.dataset.val;}const parse=s=>{const o={};if(s)for(const p of s.split(';')){const i=p.indexOf('=');o[p.slice(0,i)]=p.slice(i+1);}return o;};const match=v=>{for(const k in v)if(sel[k]!==v[k])return false;return true;};const apply=()=>{for(const sec of document.querySelectorAll('.shot')){const imgs=sec.querySelectorAll('.variant');if(!imgs.length)continue;let any=false;for(const img of imgs){const ok=match(parse(img.dataset.variant));img.hidden=!ok;if(ok)any=true;}sec.hidden=!any;}for(const b of bar.querySelectorAll('.toggle button'))b.classList.toggle('active',sel[b.parentElement.dataset.dim]===b.dataset.val);};for(const b of bar.querySelectorAll('.toggle button'))b.addEventListener('click',()=>{sel[b.parentElement.dataset.dim]=b.dataset.val;apply();});apply();}</script>
</body>
</html>
