[capture]
arches = ["x86_64"]

# Local pre-push guard: which changed paths make .githooks/pre-push re-capture the
# affected microfrontends. Screenshot-relevant source and the capture harness;
# baselines are the guard's output, so they are deliberately excluded.
[guard]
paths = [
  "apps/**/*.ts",
  "apps/**/*.tsx",
  "apps/**/*.css",
  "apps/**/*.html",
  "libs/**/*.ts",
  "libs/**/*.tsx",
  "libs/**/*.css",
  "apps/*/visual/scenarios.ts",
  "apps/*/visual/capture.ts",
  "libs/visual-harness/**/*.ts",
  # The harness serves every capture through the shared site server, so a
  # fixture change moves the captured bytes just as a harness change does.
  "libs/e2e-fixtures/**/*.ts",
  "screencomp.toml",
]

[comment]
title = "Nick DeRobertis site visual changes"
marker = "screencomp"
embed_limit = 10

[[toggle]]
key = "viewport"
label = "Viewport"
values = ["desktop", "tablet", "mobile"]

[[toggle]]
key = "render"
label = "Rendering path"
values = ["standalone", "host-composed"]

[[toggle]]
key = "state"
label = "State"
values = ["happy", "all", "empty", "loading", "error", "expanded", "employment-only"]
