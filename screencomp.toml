[capture]
arches = ["x86_64"]

# Screenshot-relevant paths retained for manual screencomp guard use.
# CI selects affected microfrontends through Nx; ordinary pushes do not capture.
[guard]
paths = [
  "apps/**/*.ts",
  "apps/**/*.tsx",
  "apps/**/*.css",
  "apps/**/*.html",
  "libs/**/*.ts",
  "libs/**/*.tsx",
  "libs/**/*.css",
  "apps/*/visual/scenarios.ts",
  "apps/*/visual/capture.ts",
  "libs/visual-harness/**/*.ts",
  # The harness serves every capture through the shared site server, so a
  # fixture change moves the captured bytes just as a harness change does.
  "libs/e2e-fixtures/**/*.ts",
  "screencomp.toml",
]

[comment]
title = "Nick DeRobertis site visual changes"
marker = "screencomp"
embed_limit = 10

[[toggle]]
key = "viewport"
label = "Viewport"
values = ["desktop", "tablet", "mobile"]

[[toggle]]
key = "render"
label = "Rendering path"
values = ["standalone", "host-composed"]

[[toggle]]
key = "state"
label = "State"
values = [
  "happy",
  "all",
  "empty",
  "loading",
  "error",
  "expanded",
  "dropdowns",
  "stats",
  "employment-only",
  "education-only",
  "no-results",
]
